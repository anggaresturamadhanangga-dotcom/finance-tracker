<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Remix Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #1a1113;
        }
        .bg-dashboard {
            background-color: #26191c;
        }
        .bg-card {
            background-color: #332226;
        }
        .bg-card-hover:hover {
            background-color: #402b30;
        }
        .accent-red {
            background-color: #e63946;
        }
    </style>
</head>
<body class="text-gray-200 min-h-screen p-2 sm:p-6 flex items-center justify-center">

    <!-- CONTAINER UTAMA DASHBOARD -->
    <div class="w-full max-w-7xl bg-dashboard rounded-[32px] p-4 sm:p-6 shadow-2xl border border-white/5 min-h-[90vh] flex flex-col md:flex-row gap-6">
        
        <!-- SECTION AUTH (DITAMPILKAN JIKA BELUM LOGIN) -->
        <section id="auth-section" class="w-full max-w-md mx-auto my-auto bg-card p-8 rounded-3xl border border-white/10 shadow-xl">
            <div class="flex justify-center mb-4">
                <div class="w-12 h-12 bg-rose-600/20 text-rose-500 rounded-2xl flex items-center justify-center text-2xl font-bold">
                    <i class="ri-wallet-3-line"></i>
                </div>
            </div>
            <h2 id="auth-title" class="text-2xl font-bold text-center text-white mb-1">Selamat Datang</h2>
            <p class="text-xs text-center text-gray-400 mb-6">Masuk ke akun Finance Tracker kamu</p>
            
            <form id="form-auth" class="space-y-4">
                <div>
                    <label for="auth-email" class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Email</label>
                    <input type="email" id="auth-email" placeholder="nama@email.com" required
                        class="w-full bg-[#201417] border border-white/10 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-rose-500 focus:outline-none">
                </div>
                <div>
                    <label for="auth-password" class="block text-xs font-semibold text-gray-400 mb-1 uppercase tracking-wider">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required
                        class="w-full bg-[#201417] border border-white/10 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-rose-500 focus:outline-none">
                </div>
                <button type="submit" id="btn-auth-submit" 
                    class="w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-rose-950">
                    Masuk
                </button>
            </form>

            <div class="text-center mt-6">
                <button type="button" id="btn-toggle-auth" onclick="toggleAuthMode()" class="text-xs text-rose-400 hover:text-rose-300">
                    Belum punya akun? Daftar di sini
                </button>
            </div>
        </section>

        <!-- DASHBOARD (TERSEMBUNYI SEBELUM LOGIN) -->
        <div id="dashboard-section" class="hidden w-full flex flex-col md:flex-row gap-6">
            
            <!-- SIDEBAR NAVIGASI KIRI -->
            <aside class="w-full md:w-20 bg-card rounded-2xl p-4 flex md:flex-col justify-between items-center border border-white/5">
                <div class="flex md:flex-col items-center gap-6 w-full">
                    <div class="w-10 h-10 bg-rose-600 rounded-xl flex items-center justify-center text-white text-xl font-bold">
                        <i class="ri-pulse-fill"></i>
                    </div>
                    <nav class="flex md:flex-col gap-4 text-gray-400 text-xl">
                        <button class="p-2 text-rose-500 bg-white/5 rounded-xl"><i class="ri-dashboard-line"></i></button>
                        <button class="p-2 hover:text-white transition"><i class="ri-exchange-line"></i></button>
                        <button class="p-2 hover:text-white transition"><i class="ri-pie-chart-line"></i></button>
                    </nav>
                </div>
                <button onclick="keluarAkun()" class="text-gray-400 hover:text-rose-500 text-xl p-2 transition" title="Keluar">
                    <i class="ri-logout-box-r-line"></i>
                </button>
            </aside>

            <!-- KONTEN UTAMA -->
            <main class="flex-1 space-y-6">
                
                <!-- HEADER (Search & Profile) -->
                <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-xl font-bold text-white flex items-center gap-2">
                            Good day, <span id="user-email-display" class="text-rose-400">User</span>
                        </h1>
                        <p class="text-xs text-gray-400">Ringkasan aktivitas keuangan kamu hari ini</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <input type="text" placeholder="Cari transaksi..." class="bg-card text-xs text-white placeholder-gray-500 px-4 py-2.5 rounded-full border border-white/10 pl-9 focus:outline-none focus:ring-1 focus:ring-rose-500">
                            <i class="ri-search-line absolute left-3 top-2.5 text-gray-500 text-xs"></i>
                        </div>
                        <div class="w-9 h-9 rounded-full bg-rose-600/30 border border-rose-500/50 flex items-center justify-center text-rose-300 font-bold text-xs">
                            FT
                        </div>
                    </div>
                </header>

                <!-- GRID UTAMA (BENTO BOX LAYOUT) -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    <!-- KANAN ATAS / BANNER UTAMA: TOTAL SALDO -->
                    <div class="lg:col-span-2 bg-gradient-to-r from-rose-900/40 to-card p-6 rounded-3xl border border-white/10 relative overflow-hidden flex flex-col justify-between min-h-[180px]">
                        <div class="absolute -right-6 -top-6 w-40 h-40 bg-rose-600/10 rounded-full blur-2xl"></div>
                        <div>
                            <span class="text-xs uppercase font-semibold text-rose-300 tracking-wider bg-rose-500/10 px-3 py-1 rounded-full border border-rose-500/20">Total Net Balance</span>
                            <h2 id="total-saldo" class="text-4xl font-extrabold text-white mt-4">Rp 0</h2>
                        </div>
                        <div class="flex gap-4 mt-6">
                            <button onclick="document.getElementById('form-transaksi').scrollIntoView({behavior: 'smooth'})" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition flex items-center gap-2">
                                <i class="ri-add-line"></i> Transaksi Baru
                            </button>
                            <button onclick="eksporData()" class="bg-white/5 hover:bg-white/10 text-white text-xs font-semibold px-4 py-2.5 rounded-xl border border-white/10 transition">
                                <i class="ri-download-2-line"></i> Backup Data
                            </button>
                        </div>
                    </div>

                    <!-- STATISTIK (DOUGHNUT CHART CARD) -->
                    <div class="bg-card p-5 rounded-3xl border border-white/5 flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-sm text-white">Your Statistic</h3>
                            <i class="ri-more-fill text-gray-500"></i>
                        </div>
                        <div class="w-36 h-36 mx-auto relative flex items-center justify-center">
                            <canvas id="grafik-keuangan"></canvas>
                        </div>
                        <div class="text-center text-xs text-gray-400 mt-2">
                            Perbandingan Pemasukan vs Pengeluaran
                        </div>
                    </div>

                </div>

                <!-- GRID BAWAH: FORM INPUT & RIWAYAT TRANSAKSI -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    <!-- FORM INPUT TRANSAKSI (CARD KIRI) -->
                    <div class="bg-card p-6 rounded-3xl border border-white/5 space-y-4">
                        <h3 class="font-bold text-sm text-white flex items-center gap-2">
                            <i class="ri-[#e63946] ri-add-circle-line text-rose-500"></i> Tambah Catatan
                        </h3>
                        <form id="form-transaksi" class="space-y-3">
                            <div>
                                <input type="text" id="keterangan" placeholder="Keterangan (contoh: Topup)" required
                                    class="w-full bg-[#201417] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-rose-500">
                            </div>
                            <div>
                                <input type="number" id="nominal" placeholder="Nominal (Rp)" required
                                    class="w-full bg-[#201417] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-rose-500">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <select id="tipe" class="bg-[#201417] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none">
                                    <option value="pemasukan">Pemasukan</option>
                                    <option value="pengeluaran">Pengeluaran</option>
                                </select>
                                <select id="kategori" class="bg-[#201417] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none">
                                    <option value="Makanan">Makanan</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Gaji">Gaji</option>
                                    <option value="Kebutuhan">Kebutuhan</option>
                                    <option value="Hiburan">Hiburan</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold py-2.5 rounded-xl transition">
                                Simpan Transaksi
                            </button>
                        </form>
                    </div>

                    <!-- RIWAYAT TRANSAKSI (CARD KANAN WIDE) -->
                    <div class="lg:col-span-2 bg-card p-6 rounded-3xl border border-white/5 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="font-bold text-sm text-white">Recent Transactions</h3>
                                <select id="filter-kategori" onchange="updateUI()" class="bg-[#201417] border border-white/10 text-xs text-gray-300 rounded-lg p-1.5 focus:outline-none">
                                    <option value="semua">Semua Kategori</option>
                                    <option value="Makanan">Makanan</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Gaji">Gaji</option>
                                    <option value="Kebutuhan">Kebutuhan</option>
                                    <option value="Hiburan">Hiburan</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>

                            <ul id="daftar-transaksi" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                                <!-- Data dimasukkan via JS -->
                            </ul>
                        </div>

                        <!-- IMPOR FILE BAR -->
                        <div class="mt-4 pt-4 border-t border-white/5 flex items-center justify-between text-xs">
                            <span class="text-gray-400">Impor data JSON lama?</span>
                            <button onclick="pilihFileImpor()" class="text-rose-400 hover:underline">Impor File</button>
                            <input type="file" id="input-file" class="hidden" accept=".json" onchange="imporData(event)">
                        </div>
                    </div>

                </div>

            </main>

        </div>

    </div>

    <!-- Script JS -->
    <script src="script.js"></script>
</body>
</html>
