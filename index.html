<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#120b0d] text-white font-sans p-4 md:p-8 min-h-screen">
    
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center bg-[#1c1215] p-5 rounded-2xl border border-white/5">
            <div>
                <h1 class="text-xl font-bold text-rose-400">Finance Tracker</h1>
                <p class="text-xs text-gray-400">Dashboard Keuangan Personal</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400 mb-1">Total Saldo Aktif</p>
                <h2 id="total-saldo" class="text-2xl font-bold text-white">Rp 0</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Bento Box: Form Input (Kiri) -->
            <div class="md:col-span-1 bg-[#1c1215] p-5 rounded-2xl border border-white/5 h-fit">
                <h3 class="text-sm font-bold text-white mb-4 border-b border-white/10 pb-2">Catat Transaksi</h3>
                <form id="form-transaksi" class="space-y-3">
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Keterangan</label>
                        <input type="text" id="keterangan" required placeholder="Beli kopi, Gaji, dll" 
                               class="w-full bg-[#2a1b1f] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-rose-500">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Nominal (Rp)</label>
                        <input type="number" id="nominal" required placeholder="50000" 
                               class="w-full bg-[#2a1b1f] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-rose-500">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Tipe</label>
                            <select id="tipe" class="w-full bg-[#2a1b1f] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none">
                                <option value="Pengeluaran">Pengeluaran</option>
                                <option value="Pemasukan">Pemasukan</option>
                                <option value="Transfer">Transfer Bank</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Kategori</label>
                            <select id="kategori" class="w-full bg-[#2a1b1f] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none">
                                <option value="Makanan">Makanan</option>
                                <option value="Transportasi">Transportasi</option>
                                <option value="Gaji">Gaji</option>
                                <option value="Biaya Admin">Biaya Admin</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                    </div>

                    <!-- FITUR BARU: Tanggal & Metode Pembayaran -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Tanggal</label>
                            <input type="date" id="tanggal" required 
                                   class="w-full bg-[#2a1b1f] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Sumber Uang</label>
                            <select id="metode_pembayaran" class="w-full bg-[#2a1b1f] border border-white/10 rounded-xl p-2.5 text-xs text-white focus:outline-none">
                                <option value="Saldo">💳 Saldo/Bank</option>
                                <option value="Cash">💵 Uang Cash</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white text-sm font-bold py-3 rounded-xl transition mt-2">
                        Simpan Transaksi
                    </button>
                </form>
            </div>

            <!-- Bento Box: Riwayat Transaksi (Kanan) -->
            <div class="md:col-span-2 bg-[#1c1215] p-5 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-2">
                    <h3 class="text-sm font-bold text-white">Riwayat Terbaru</h3>
                </div>
                
                <!-- List Riwayat -->
                <div id="riwayat-list" class="space-y-2 h-[400px] overflow-y-auto pr-2">
                    <p class="text-xs text-gray-500 text-center mt-10">Memuat data...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Panggil Script JS -->
    <script src="script.js"></script>
</body>
</html>
