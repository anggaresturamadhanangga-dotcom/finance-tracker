<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <div class="max-w-md mx-auto p-4 sm:max-w-xl md:max-w-2xl">
        
        <!-- SECTION 1: FORM AUTHENTICATION (LOGIN & REGISTER) -->
        <section id="auth-section" class="bg-white p-6 rounded-xl shadow-md my-12">
            <h2 id="auth-title" class="text-2xl font-bold text-center text-indigo-600 mb-2">Masuk ke Akun</h2>
            <p class="text-xs text-center text-gray-500 mb-6">Kelola data keuanganmu secara aman di cloud</p>
            
            <form id="form-auth" class="space-y-4">
                <div>
                    <label for="auth-email" class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="auth-email" placeholder="nama@email.com" required
                        class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label for="auth-password" class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required
                        class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" id="btn-auth-submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
                    Masuk
                </button>
            </form>

            <div class="text-center mt-4">
                <button type="button" id="btn-toggle-auth" onclick="toggleAuthMode()" class="text-xs text-indigo-600 hover:underline">
                    Belum punya akun? Daftar di sini
                </button>
            </div>
        </section>

        <!-- SECTION 2: DASHBOARD KEUANGAN (TERSEMBUNYI SEBELUM LOGIN) -->
        <div id="dashboard-section" class="hidden">
            
            <!-- Header & Tombol Logout -->
            <header class="flex justify-between items-center my-6">
                <div>
                    <h1 class="text-2xl font-bold text-indigo-600">My Finance Tracker</h1>
                    <p id="user-email-display" class="text-xs text-gray-500"></p>
                </div>
                <button onclick="keluarAkun()" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold py-2 px-3 rounded-lg border border-red-200 transition">
                    🚪 Keluar
                </button>
            </header>

            <!-- Ringkasan Saldo -->
            <section class="bg-indigo-600 text-white rounded-xl p-5 shadow-lg mb-6">
                <p class="text-sm opacity-80">Total Saldo saat ini:</p>
                <h2 id="total-saldo" class="text-3xl font-extrabold mt-1">Rp 0</h2>
            </section>

            <!-- Visualisasi Grafik -->
            <section class="bg-white p-5 rounded-xl shadow-md mb-6">
                <h3 class="font-bold text-lg mb-4 text-gray-700">Analisis Keuangan</h3>
                <div class="max-w-xs mx-auto">
                    <canvas id="grafik-keuangan"></canvas>
                </div>
            </section>

            <!-- Form Input Transaksi -->
            <section class="bg-white p-5 rounded-xl shadow-md mb-6">
                <h3 class="font-bold text-lg mb-4 text-gray-700">Tambah Transaksi Baru</h3>
                <form id="form-transaksi" class="space-y-4">
                    <div>
                        <label for="keterangan" class="block text-sm font-medium mb-1">Keterangan</label>
                        <input type="text" id="keterangan" placeholder="Contoh: Makan Siang" required
                            class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label for="nominal" class="block text-sm font-medium mb-1">Nominal (Rp)</label>
                            <input type="number" id="nominal" placeholder="15000" required
                                class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label for="tipe" class="block text-sm font-medium mb-1">Tipe</label>
                            <select id="tipe" 
                                class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="pemasukan">Pemasukan</option>
                                <option value="pengeluaran">Pengeluaran</option>
                            </select>
                        </div>
                        <div>
                            <label for="kategori" class="block text-sm font-medium mb-1">Kategori</label>
                            <select id="kategori" 
                                class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="Makanan">Makanan</option>
                                <option value="Transportasi">Transportasi</option>
                                <option value="Gaji">Gaji</option>
                                <option value="Kebutuhan">Kebutuhan</option>
                                <option value="Hiburan">Hiburan</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
                        + Tambah Transaksi
                    </button>
                </form>
            </section>

            <!-- Riwayat Transaksi & Filter -->
            <section class="bg-white p-5 rounded-xl shadow-md mb-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-lg text-gray-700">Riwayat Transaksi</h3>
                    <select id="filter-kategori" onchange="updateUI()" 
                        class="border border-gray-300 rounded-lg p-1.5 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="semua">Semua Kategori</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Transportasi">Transportasi</option>
                        <option value="Gaji">Gaji</option>
                        <option value="Kebutuhan">Kebutuhan</option>
                        <option value="Hiburan">Hiburan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <ul id="daftar-transaksi" class="space-y-3">
                    <!-- Data akan masuk di sini via JS -->
                </ul>
            </section>

            <!-- Backup & Restore -->
            <section class="bg-white p-5 rounded-xl shadow-md">
                <h3 class="font-bold text-sm text-gray-700 mb-3">Backup & Restore Data</h3>
                <div class="flex gap-3">
                    <button onclick="eksporData()" 
                        class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-3 rounded-lg transition">
                        📥 Ekspor Data (JSON)
                    </button>
                    <button onclick="pilihFileImpor()" 
                        class="flex-1 bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold py-2 px-3 rounded-lg transition">
                        📤 Impor Data
                    </button>
                    <input type="file" id="input-file" class="hidden" accept=".json" onchange="imporData(event)">
                </div>
            </section>

        </div>

    </div>

    <!-- Hubungkan File JavaScript -->
    <script src="script.js"></script>
</body>
</html>
